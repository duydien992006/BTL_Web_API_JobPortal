<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Tạo tài khoản</h2>
    <p class="muted mb">Bạn là ai?</p>
    <form name="frm" ng-submit="frm.$valid && vm.dangKy()" novalidate>
      <div class="role-pick">
        <label ng-class="{on: vm.f.vaiTro==='UngVien'}"><input type="radio" ng-model="vm.f.vaiTro" value="UngVien"><i class="fa-regular fa-user"></i> Ứng viên</label>
        <label ng-class="{on: vm.f.vaiTro==='NhaTuyenDung'}"><input type="radio" ng-model="vm.f.vaiTro" value="NhaTuyenDung"><i class="fa-regular fa-building"></i> Nhà tuyển dụng</label>
      </div>
      <div class="form-group"><label>Họ và tên</label><input ng-model="vm.f.hoTen" required maxlength="100"></div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input type="email" ng-model="vm.f.email" required maxlength="100"></div>
        <div class="form-group"><label>Số điện thoại</label><input ng-model="vm.f.soDienThoai" maxlength="20"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Mật khẩu (từ 6 ký tự)</label><input type="password" ng-model="vm.f.matKhau" required minlength="6" maxlength="72"></div>
        <div class="form-group"><label>Nhập lại mật khẩu</label><input type="password" ng-model="vm.f.nhapLai" required></div>
      </div>
      <div class="error-text" ng-if="vm.loi">{{vm.loi}}</div>
      <button class="btn btn-primary btn-block" ng-disabled="frm.$invalid || vm.dangGui">Đăng ký</button>
    </form>
    <div class="auth-links"><span>Đã có tài khoản?</span><a href="#/dang-nhap">Đăng nhập</a></div>
  </div>
</div>
