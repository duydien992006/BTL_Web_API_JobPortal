<div class="container">
  <div class="row between"><h1 class="page-title">Công ty của tôi</h1>
    <button class="btn btn-primary" ng-click="vm.moi()"><i class="fa-solid fa-plus"></i> Thêm công ty</button></div>

  <div class="card app-card" ng-repeat="c in vm.ds">
    <div class="row between">
      <div class="row">
        <logo-box ten="c.tenCongTy" url="c.logoUrl"></logo-box>
        <div><b style="font-size:17px">{{c.tenCongTy}}</b>
          <span class="badge" ng-class="c.daXacMinh ? 'green' : 'orange'">{{c.daXacMinh ? 'Đã xác minh' : 'Chờ xác minh'}}</span>
          <div class="muted">{{c.diaChi}}</div></div>
      </div>
      <div class="row">
        <button class="btn btn-outline btn-sm" ng-click="vm.sua(c)">Sửa</button>
        <button class="btn btn-danger btn-sm" ng-click="vm.xoa(c)">Xóa</button>
      </div>
    </div>
    <div class="note" ng-if="!c.daXacMinh">Công ty cần được quản trị viên xác minh trước khi đăng tin tuyển dụng.</div>
  </div>
  <div class="empty card" ng-if="vm.ds && !vm.ds.length">Bạn chưa có công ty nào. Hãy tạo công ty để bắt đầu đăng tin.</div>
</div>

<div class="modal-bg" ng-if="vm.hien" ng-click="vm.hien=false">
  <div class="modal" ng-click="$event.stopPropagation()">
    <div class="modal-head"><h3>{{vm.f.id ? 'Sửa công ty' : 'Thêm công ty'}}</h3><button class="x" ng-click="vm.hien=false">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Tên công ty *</label><input ng-model="vm.f.tenCongTy" maxlength="200"></div>
      <div class="form-group"><label>Địa chỉ</label><input ng-model="vm.f.diaChi" maxlength="300"></div>
      <div class="form-group"><label>Đường dẫn logo (URL ảnh)</label><input ng-model="vm.f.logoUrl" maxlength="500" placeholder="https://..."></div>
      <div class="form-group"><label>Giới thiệu</label><textarea ng-model="vm.f.moTa"></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" ng-click="vm.hien=false">Hủy</button>
      <button class="btn btn-primary" ng-click="vm.luu()" ng-disabled="!vm.f.tenCongTy">Lưu</button></div>
  </div>
</div>
