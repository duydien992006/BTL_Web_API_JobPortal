<div class="container">
  <h1 class="page-title">Tài khoản của tôi</h1>
  <div class="grid g2">
    <div class="card">
      <h3>Thông tin cá nhân</h3>
      <div class="form-group"><label>Email</label><input ng-model="vm.u.email" disabled></div>
      <div class="form-group"><label>Vai trò</label><div><span class="badge" ng-class="vm.u.vaiTro | mau">{{vm.u.vaiTro | nhan}}</span></div></div>
      <div class="form-group"><label>Họ và tên</label><input ng-model="vm.f.hoTen" maxlength="100"></div>
      <div class="form-group"><label>Số điện thoại</label><input ng-model="vm.f.soDienThoai" maxlength="20"></div>
      <button class="btn btn-primary" ng-click="vm.luu()">Lưu thay đổi</button>
    </div>
    <div class="card">
      <h3>Đổi mật khẩu</h3>
      <div class="form-group"><label>Mật khẩu hiện tại</label><input type="password" ng-model="vm.mk.cu"></div>
      <div class="form-group"><label>Mật khẩu mới (từ 6 ký tự)</label><input type="password" ng-model="vm.mk.moi" maxlength="72"></div>
      <div class="form-group"><label>Nhập lại mật khẩu mới</label><input type="password" ng-model="vm.mk.nhapLai"></div>
      <div class="error-text" ng-if="vm.loi">{{vm.loi}}</div>
      <button class="btn btn-primary" ng-click="vm.doiMatKhau()" ng-disabled="!vm.mk.cu || !vm.mk.moi">Đổi mật khẩu</button>
    </div>
  </div>
</div>
