<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Chào mừng bạn trở lại</h2>
    <p class="muted mb">Đăng nhập để tìm việc hoặc quản lý tuyển dụng</p>
    <form name="frm" ng-submit="frm.$valid && vm.dangNhap()" novalidate>
      <div class="form-group"><label>Email</label><input type="email" ng-model="vm.f.email" required></div>
      <div class="form-group"><label>Mật khẩu</label><input type="password" ng-model="vm.f.matKhau" required></div>
      <div class="error-text" ng-if="vm.loi">{{vm.loi}}</div>
      <button class="btn btn-primary btn-block" ng-disabled="frm.$invalid || vm.dangGui">Đăng nhập</button>
    </form>
    <div class="auth-links"><a href="#/quen-mat-khau">Quên mật khẩu?</a><a href="#/dang-ky">Đăng ký tài khoản</a></div>
  </div>
</div>
