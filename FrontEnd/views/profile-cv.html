<div class="container">
  <h1 class="page-title">Hồ sơ &amp; CV của tôi</h1>
  <div class="layout-2" style="margin-top:0">
    <aside class="card">
      <h3>Tải CV mới</h3>
      <div class="form-group"><label>File CV (PDF, DOC, DOCX, tối đa 5MB)</label>
        <input type="file" id="fileCv" file-model="vm.file" accept=".pdf,.doc,.docx"></div>
      <div class="form-group"><label>Số năm kinh nghiệm</label><input type="number" min="0" max="60" ng-model="vm.f.soNam"></div>
      <div class="form-group"><label>Kỹ năng của bạn</label>
        <div class="check-list"><label ng-repeat="k in vm.kyNang"><input type="checkbox" ng-model="vm.chon[k.id]"> {{k.tenKyNang}}</label></div>
        <div class="hint">Kỹ năng dùng để gợi ý việc làm phù hợp.</div></div>
      <button class="btn btn-primary btn-block" ng-click="vm.upload()" ng-disabled="vm.dangGui"><i class="fa-solid fa-upload"></i> Tải lên</button>
      <a class="btn btn-ghost btn-block" href="#/mau-cv">Xem mẫu CV</a>
    </aside>
    <section>
      <div class="card app-card" ng-repeat="h in vm.ds">
        <div class="row between">
          <div class="row"><i class="fa-regular fa-file-pdf text-green" style="font-size:28px"></i>
            <div><b>{{h.tenFileGoc}}</b><div class="muted">{{h.soNamKinhNghiem}} năm kinh nghiệm · tải lên {{h.ngayTaiLen | date:'dd/MM/yyyy HH:mm'}}</div></div></div>
          <div class="row">
            <button class="btn btn-outline btn-sm" ng-click="vm.taiVe(h)"><i class="fa-solid fa-download"></i> Tải về</button>
            <button class="btn btn-danger btn-sm" ng-click="vm.xoa(h)"><i class="fa-regular fa-trash-can"></i> Xóa</button>
          </div>
        </div>
      </div>
      <div class="empty card" ng-if="vm.ds && !vm.ds.length">Bạn chưa có CV nào. Hãy tải CV đầu tiên để bắt đầu ứng tuyển.</div>
    </section>
  </div>
</div>
