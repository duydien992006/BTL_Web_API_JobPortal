<div class="container">
  <h1 class="page-title">Quản lý người dùng</h1>
  <form class="toolbar" ng-submit="vm.tai(1)">
    <input ng-model="vm.f.tuKhoa" placeholder="Tìm theo email hoặc họ tên...">
    <select ng-model="vm.f.vaiTro" ng-change="vm.tai(1)">
      <option value="">Tất cả vai trò</option><option value="UngVien">Ứng viên</option>
      <option value="NhaTuyenDung">Nhà tuyển dụng</option><option value="QuanTriVien">Quản trị viên</option>
    </select>
    <button class="btn btn-primary">Tìm</button>
  </form>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Người dùng</th><th>Vai trò</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr></thead>
    <tbody><tr ng-repeat="u in vm.kq.danhSach">
      <td><b>{{u.hoTen}}</b><div class="muted">{{u.email}} · {{u.soDienThoai}}</div></td>
      <td><span class="badge" ng-class="u.vaiTro | mau">{{u.vaiTro | nhan}}</span></td>
      <td>{{u.ngayTao | date:'dd/MM/yyyy'}}</td>
      <td><span class="badge" ng-class="u.biKhoa ? 'red' : 'green'">{{u.biKhoa ? 'Đã khóa' : 'Hoạt động'}}</span>
        <div class="muted" ng-if="u.biKhoa"><small>{{u.lyDoKhoa}}</small></div></td>
      <td>
        <button class="btn btn-danger btn-sm" ng-if="!u.biKhoa && u.vaiTro!=='QuanTriVien'" ng-click="vm.khoa(u)">Khóa</button>
        <button class="btn btn-outline btn-sm" ng-if="u.biKhoa" ng-click="vm.moKhoa(u)">Mở khóa</button>
      </td>
    </tr></tbody>
  </table></div>
  <pager trang="vm.kq.trang" tong="vm.kq.tongSoTrang" on-chon="vm.tai(t)"></pager>
</div>

<div class="modal-bg" ng-if="vm.m" ng-click="vm.m=null">
  <div class="modal" ng-click="$event.stopPropagation()">
    <div class="modal-head"><h3>Khóa tài khoản {{vm.m.u.email}}</h3><button class="x" ng-click="vm.m=null">×</button></div>
    <div class="modal-body"><div class="form-group"><label>Lý do khóa *</label><textarea ng-model="vm.m.lyDo" maxlength="300"></textarea></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" ng-click="vm.m=null">Hủy</button>
      <button class="btn btn-danger" ng-click="vm.xacNhanKhoa()" ng-disabled="!vm.m.lyDo">Khóa tài khoản</button></div>
  </div>
</div>
