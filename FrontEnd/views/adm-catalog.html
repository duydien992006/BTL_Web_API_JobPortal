<div class="container">
  <h1 class="page-title">Danh mục</h1>
  <div class="grid g2">
    <div class="card">
      <h3>Mẫu CV</h3>
      <div class="form-group"><label>File mẫu (PDF, DOC, DOCX)</label><input type="file" id="fileMau" file-model="vm.file" accept=".pdf,.doc,.docx"></div>
      <div class="form-group"><label>Tên mẫu *</label><input ng-model="vm.f.tenMau" maxlength="100"></div>
      <div class="form-group"><label>Mô tả</label><input ng-model="vm.f.moTa" maxlength="500"></div>
      <button class="btn btn-primary" ng-click="vm.themMau()" ng-disabled="!vm.f.tenMau"><i class="fa-solid fa-upload"></i> Thêm mẫu</button>
      <div class="note mt" ng-repeat="m in vm.mau"><div class="row between"><span><b>{{m.tenMau}}</b><div class="muted">{{m.tenFileGoc}}</div></span>
        <button class="btn btn-danger btn-sm" ng-click="vm.xoaMau(m)">Xóa</button></div></div>
    </div>
    <div class="card">
      <h3>Kỹ năng ({{vm.kyNang.length}})</h3>
      <div class="row"><input ng-model="vm.tenKyNang" maxlength="100" placeholder="VD: C#, SQL Server, ReactJS..." ng-keyup="$event.keyCode===13 && vm.tenKyNang && vm.themKyNang()">
        <button class="btn btn-primary" ng-click="vm.themKyNang()" ng-disabled="!vm.tenKyNang">Thêm</button></div>
      <div class="tags mt"><span class="tag" ng-repeat="k in vm.kyNang">{{k.tenKyNang}}</span></div>
      <div class="hint">Kỹ năng dùng cho tin tuyển dụng, hồ sơ CV và gợi ý việc làm.</div>
    </div>
  </div>
</div>
