<div class="container" style="max-width:820px">
  <h1 class="page-title">{{vm.sua ? 'Sửa tin tuyển dụng' : 'Đăng tin tuyển dụng'}}</h1>
  <form class="card" name="frm" ng-submit="frm.$valid && vm.luu()" novalidate>
    <div class="form-group" ng-if="!vm.sua"><label>Công ty *</label>
      <select ng-model="vm.f.congTyId" required
              ng-options="c.id as (c.tenCongTy + (c.daXacMinh ? '' : ' (chưa xác minh)')) disable when !c.daXacMinh for c in vm.congTy"></select>
      <div class="hint">Chỉ công ty đã được quản trị viên xác minh mới đăng tin được.</div></div>
    <div class="form-group"><label>Tiêu đề *</label><input ng-model="vm.f.tieuDe" required maxlength="200" placeholder="VD: Lập trình viên Backend .NET"></div>
    <div class="form-row">
      <div class="form-group"><label>Địa điểm làm việc</label><input ng-model="vm.f.diaDiem" maxlength="200"></div>
      <div class="form-group"><label>Hạn nộp hồ sơ *</label><input type="date" ng-model="vm.f.ngayHetHan" required></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Lương từ (VNĐ)</label><input type="number" min="0" ng-model="vm.f.mucLuongTu"></div>
      <div class="form-group"><label>Lương đến (VNĐ)</label><input type="number" min="0" ng-model="vm.f.mucLuongDen"></div>
    </div>
    <div class="form-group" ng-if="!vm.sua"><label>Kỹ năng yêu cầu *</label>
      <div class="check-list"><label ng-repeat="k in vm.kyNang"><input type="checkbox" ng-model="vm.chon[k.id]"> {{k.tenKyNang}}</label></div></div>
    <div class="hint" ng-if="vm.sua">Kỹ năng yêu cầu không sửa được sau khi đăng.</div>
    <div class="form-group"><label>Mô tả công việc</label><textarea ng-model="vm.f.moTaCongViec" maxlength="10000" style="min-height:180px"></textarea></div>
    <div class="error-text" ng-if="vm.loi">{{vm.loi}}</div>
    <div class="row"><button class="btn btn-primary" ng-disabled="frm.$invalid || vm.dangGui">{{vm.sua ? 'Lưu thay đổi' : 'Đăng tin'}}</button>
      <a class="btn btn-ghost" href="#/nha-tuyen-dung/tin">Hủy</a></div>
  </form>
</div>
